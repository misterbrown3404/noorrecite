<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QariVerse - Audio Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Amiri:wght@400;700&family=Literata:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@100..900&family=Inter:wght@100..900&family=Literata:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom Neumorphic Soft Extrusion */
        .neumorphic-press {
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1), inset -2px -2px 5px rgba(255,255,255,0.05);
        }
        .neumorphic-elevated {
            box-shadow: 8px 8px 16px rgba(0, 106, 57, 0.1), -8px -8px 16px rgba(255, 255, 255, 0.05);
        }
        /* Glassmorphism Inner Stroke */
        .glass-stroke {
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* Waveform Animation */
        @keyframes wave {
            0%, 100% { height: 8px; }
            50% { height: 32px; }
        }
        .wave-bar {
            animation: wave 1.2s ease-in-out infinite;
        }
        /* Background Pattern */
        .islamic-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l2.121 21.213L51.213 9 42.426 30l21.213 2.121L42.426 34.243 51.213 51l-19.092-8.787L30 60l-2.121-19.092L9 51.213 17.787 30l-21.213-2.121 21.213-2.122L9 9l19.092 8.787z' fill='%23006a39' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#8df5e4",
                        "surface-dim": "#d8dadc",
                        "tertiary-container": "#a16800",
                        "on-tertiary-container": "#fffbff",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-fixed": "#2a1800",
                        "secondary-fixed-dim": "#70d8c8",
                        "surface-container-low": "#f2f4f6",
                        "on-surface-variant": "#3e4a3f",
                        "secondary-container": "#8df5e4",
                        "background": "#f7f9fb",
                        "surface-bright": "#f7f9fb",
                        "surface-variant": "#e0e3e5",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#005048",
                        "surface-container": "#eceef0",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#805200",
                        "tertiary-fixed": "#ffddb5",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-primary": "#64dd91",
                        "secondary": "#006b5f",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#82faab",
                        "primary-fixed-dim": "#64dd91",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#00210e",
                        "on-primary-container": "#f6fff4",
                        "error": "#ba1a1a",
                        "outline-variant": "#bdcabc",
                        "on-secondary-container": "#007165",
                        "on-background": "#191c1e",
                        "on-secondary-fixed": "#00201c",
                        "surface-tint": "#006d3a",
                        "on-surface": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "primary-container": "#008649",
                        "primary": "#006a39",
                        "outline": "#6d7a6f",
                        "surface": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#643f00",
                        "on-primary-fixed-variant": "#00522b",
                        "tertiary-fixed-dim": "#ffb957",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "4px",
                        "margin": "24px",
                        "card-padding": "20px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "body-en": ["Inter"],
                        "body-ar": ["Amiri"],
                        "display-ar": ["Amiri"],
                        "headline-lg-mobile": ["Literata"],
                        "headline-lg": ["Literata"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-en": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "body-ar": ["24px", { "lineHeight": "48px", "fontWeight": "400" }],
                        "display-ar": ["48px", { "lineHeight": "72px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-en text-on-surface overflow-hidden">
<!-- Luminous Layer 0: Background -->
<div class="fixed inset-0 z-0 overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center opacity-30 scale-110 blur-sm" data-alt="A cinematic, low-angle shot of a majestic mosque interior featuring intricate geometric tiles and grand arches. The lighting is ethereal and soft, with sunbeams filtering through gold-accented lattices. The color palette is dominated by deep emerald greens and warm golds, creating a serene and spiritual sanctuary atmosphere. High-fidelity textures and professional architectural photography style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDjBDMGi8WMI4NU8hE0pmXF3JUJ0ueyaO2ZE0aBwilOTd86ZM9olh38X4hLHPACL4RZu9u7cUVS0ktVPTR-a0BIXBlwN_1ydMmhhs_XAlwUPNCCtBe_dowT-moHmQRinW2ANMM01tFpEb-pKG3R-fCkLbpDy1ICKbGW2YM_V9jHq9esNMvieY7AY0KPFuv4OEx22RGOrZlt5LrpOau9xdE_zYyrL5mrxvfkXYG7HgK3RhklnwdIpcdWEmcHnCLT7NZXy2UhfZSWpA')"></div>
<div class="absolute inset-0 islamic-pattern opacity-10"></div>
<div class="absolute inset-0 bg-gradient-to-b from-transparent via-background/60 to-background"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 h-screen flex flex-col px-margin pb-20">
<!-- Header / Back Navigation -->
<header class="h-16 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface/50 backdrop-blur-md glass-stroke text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-center">
<p class="font-label-caps text-label-caps text-on-surface-variant">NOW PLAYING</p>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Surah Ar-Rahman</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface/50 backdrop-blur-md glass-stroke text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Artwork Area -->
<div class="flex-grow flex flex-col items-center justify-center py-8">
<div class="relative w-full aspect-square max-w-[320px] neumorphic-elevated rounded-3xl overflow-hidden glass-stroke">
<img class="w-full h-full object-cover" data-alt="A premium close-up of a holy Quran with ornate gold calligraphy on a deep emerald green leather cover. The book is resting on a luxurious velvet cushion inside a tranquil, dimly lit prayer room. The focus is sharp on the gold details, while the background softly blurs into warm, atmospheric bokeh. Soft light highlights the tactile texture of the cover and the reflective gold gilding on the page edges." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJDvQmmQ75Qaz5xK-pIMrhjKtRFRxD_pB1r82cUWl3IGLEGjwBKcQv1yDQelkFdtYTin_uI-Az_5hgEW14VwBQ5LIdn0Q5i5KYjKd1_LYWkBoBFD7jG2rnJwJ7MwI3MIqvEf-GKiT1N47fDkR9Vc37HmsZHZtNM2zAJQHCbJQHbV1PGcKQearHdWDalSjJnmBFZnxbjbswbmW7ABLYkQUIXWfd35V1o0d6Ksa-4IzRegXkDdfkWuM56qafT-Lhx6chTIOiIvPeEg"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<div class="absolute bottom-6 left-6">
<span class="bg-tertiary-container text-on-tertiary-container px-3 py-1 rounded-full font-label-caps text-[10px] tracking-widest uppercase">Mishary Rashid</span>
</div>
</div>
<!-- Waveform Visualization -->
<div class="flex items-end justify-center gap-1.5 h-16 mt-12 w-full max-w-[280px]">
<!-- Dynamic Wave Bars -->
<div class="wave-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.1s; height: 12px;"></div>
<div class="wave-bar w-1.5 bg-primary/80 rounded-full" style="animation-delay: 0.3s; height: 24px;"></div>
<div class="wave-bar w-1.5 bg-primary/60 rounded-full" style="animation-delay: 0.2s; height: 18px;"></div>
<div class="wave-bar w-1.5 bg-primary/40 rounded-full" style="animation-delay: 0.5s; height: 32px;"></div>
<div class="wave-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.4s; height: 14px;"></div>
<div class="wave-bar w-1.5 bg-primary/70 rounded-full" style="animation-delay: 0.6s; height: 28px;"></div>
<div class="wave-bar w-1.5 bg-primary/90 rounded-full" style="animation-delay: 0.1s; height: 20px;"></div>
<div class="wave-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.8s; height: 10px;"></div>
<div class="wave-bar w-1.5 bg-primary/50 rounded-full" style="animation-delay: 0.2s; height: 22px;"></div>
<div class="wave-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.4s; height: 16px;"></div>
<div class="wave-bar w-1.5 bg-primary/80 rounded-full" style="animation-delay: 0.7s; height: 30px;"></div>
<div class="wave-bar w-1.5 bg-primary rounded-full" style="animation-delay: 0.3s; height: 12px;"></div>
</div>
</div>
<!-- Controls Area -->
<div class="space-y-8">
<!-- Playback Slider -->
<div class="space-y-2">
<div class="relative w-full h-1.5 bg-surface-variant rounded-full overflow-hidden neumorphic-press">
<div class="absolute top-0 left-0 h-full w-1/3 bg-gradient-to-r from-tertiary to-tertiary-fixed shadow-[0_0_8px_rgba(128,82,0,0.5)]"></div>
<div class="absolute top-1/2 left-1/3 -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-white border-2 border-tertiary rounded-full shadow-lg"></div>
</div>
<div class="flex justify-between font-label-caps text-label-caps text-on-surface-variant">
<span>02:14</span>
<span>06:45</span>
</div>
</div>
<!-- Main Player Buttons -->
<div class="flex items-center justify-between pb-8">
<button class="text-primary-container active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[28px]">shuffle</span>
</button>
<div class="flex items-center gap-8">
<button class="w-14 h-14 flex items-center justify-center rounded-full bg-surface-container/40 backdrop-blur-lg glass-stroke text-primary neumorphic-elevated active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[32px]">skip_previous</span>
</button>
<!-- Play Button -->
<button class="w-20 h-20 flex items-center justify-center rounded-full bg-gradient-to-br from-primary-container to-primary text-white shadow-[0_12px_24px_rgba(0,106,57,0.3)] active:scale-95 transition-transform hover:brightness-110">
<span class="material-symbols-outlined text-[48px] fill-icon">pause</span>
</button>
<button class="w-14 h-14 flex items-center justify-center rounded-full bg-surface-container/40 backdrop-blur-lg glass-stroke text-primary neumorphic-elevated active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[32px]">skip_next</span>
</button>
</div>
<button class="text-primary-container active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[28px]">repeat</span>
</button>
</div>
<!-- Bottom Action Drawer (Neumorphic Inset) -->
<div class="bg-surface-container/30 backdrop-blur-2xl rounded-t-3xl p-6 glass-stroke neumorphic-press -mx-margin">
<div class="flex items-center justify-around">
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">speed</span>
<span class="font-label-caps text-[10px]">1.0X</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">playlist_play</span>
<span class="font-label-caps text-[10px]">QUEUE</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">closed_caption</span>
<span class="font-label-caps text-[10px]">LYRICS</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">share</span>
<span class="font-label-caps text-[10px]">SHARE</span>
</button>
</div>
</div>
</div>
</main>
<!-- Shared Bottom Nav Replacement for Screen Focus -->
<!-- We suppress the standard BottomNavBar as per "Task-Focused" rule but provide a 'minimize' handle hint -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center pb-2 pointer-events-none">
<div class="w-12 h-1 bg-on-surface-variant/20 rounded-full"></div>
</div>
<script>
        // Simple micro-interaction for playback
        const playBtn = document.querySelector('button .fill-icon');
        let isPlaying = true;

        playBtn.parentElement.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? 'pause' : 'play_arrow';
            
            // Toggle wave animation state
            const waves = document.querySelectorAll('.wave-bar');
            waves.forEach(wave => {
                wave.style.animationPlayState = isPlaying ? 'running' : 'paused';
            });
        });

        // Add subtle parallax to artwork
        document.addEventListener('mousemove', (e) => {
            const artwork = document.querySelector('.neumorphic-elevated');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            artwork.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body></html>
