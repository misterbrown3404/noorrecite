<style>

<body class="bg-background font-body-en text-on-background min-h-screen relative overflow-x-hidden bg-pattern">

</div>
</div>
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-tertiary/5 rounded-full blur-[80px]"></div>
</div>
<!-- Main Content -->
<main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-margin py-12">
<!-- Logo Header -->
<header class="mb-10 text-center animate-float">
<div class="flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">QariVerse</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-1">THE SANCTUARY FOR YOUR SOUL</p>
</header>
<!-- Auth Card -->
<div class="w-full max-w-md glass-panel rounded-[32px] p-8 md:p-10 transition-all duration-500 hover:shadow-xl">
<div class="flex flex-col space-y-6">
<!-- Toggle Tabs -->
<div class="flex bg-surface-container-low/50 p-1.5 rounded-full neumorphic-inset">
<button class="flex-1 py-2 rounded-full font-label-caps text-label-caps text-on-primary bg-primary shadow-sm transition-all" id="login-tab">LOGIN</button>
<button class="flex-1 py-2 rounded-full font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-all" id="signup-tab">SIGN UP</button>
</div>
<div class="text-center space-y-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface" id="auth-title">Welcome Back</h2>
<p class="text-on-surface-variant opacity-80" id="auth-subtitle">Step into your personal meditative journey.</p>
</div>
<!-- Input Fields -->
<form class="space-y-4" onsubmit="event.preventDefault()">
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-4">EMAIL ADDRESS</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-14 pl-12 pr-6 rounded-2xl neumorphic-inset focus:ring-2 focus:ring-primary/20 focus:border-primary border-transparent transition-all outline-none text-on-surface" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center px-4">
<label class="font-label-caps text-label-caps text-on-surface-variant">PASSWORD</label>

</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-14 pl-12 pr-6 rounded-2xl neumorphic-inset focus:ring-2 focus:ring-primary/20 focus:border-primary border-transparent transition-all outline-none text-on-surface" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full h-14 mt-4 bg-gradient-to-r from-primary to-secondary text-on-primary font-bold rounded-2xl emerald-glow active:scale-[0.98] transition-transform flex items-center justify-center space-x-2">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center space-x-4">
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
<span class="font-label-caps text-[10px] text-outline">OR CONTINUE WITH</span>
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Social Auth -->
<button class="w-full h-14 flex items-center justify-center space-x-3 rounded-2xl border border-white/40 bg-white/30 hover:bg-white/50 transition-colors active:scale-[0.98]">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-5.38z" fill="#EA4335"></path>
</svg>
<span class="font-label-caps text-label-caps text-on-surface">Continue with Google</span>
</button>
<!-- Footer -->
<div class="text-center">
<p class="text-[12px] text-on-surface-variant">
                        By continuing, you agree to our 
                        <a class="text-primary underline" href="#">Terms of Service</a> and 
                        <a class="text-primary underline" href="#">Privacy Policy</a>.
                    </p>
</div>
</div>
</div>
<!-- Decorative Ornaments -->
<div class="mt-12 flex space-x-4 opacity-30">
<span class="material-symbols-outlined text-tertiary">star_rate</span>
<span class="material-symbols-outlined text-tertiary text-[40px]">spa</span>
<span class="material-symbols-outlined text-tertiary">star_rate</span>
</div>
</main>
<script>
        const loginTab = document.getElementById('login-tab');
        const signupTab = document.getElementById('signup-tab');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');

        signupTab.addEventListener('click', () => {
            loginTab.classList.remove('bg-primary', 'text-on-primary');
            loginTab.classList.add('text-on-surface-variant');
            signupTab.classList.add('bg-primary', 'text-on-primary');
            signupTab.classList.remove('text-on-surface-variant');
            authTitle.innerText = "Create Account";
            authSubtitle.innerText = "Begin your journey into the divine wisdom.";
        });

        loginTab.addEventListener('click', () => {
            signupTab.classList.remove('bg-primary', 'text-on-primary');
            signupTab.classList.add('text-on-surface-variant');
            loginTab.classList.add('bg-primary', 'text-on-primary');
            loginTab.classList.remove('text-on-surface-variant');
            authTitle.innerText = "Welcome Back";
            authSubtitle.innerText = "Step into your personal meditative journey.";
        });

        // Simple parallax effect for background
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            const bg = document.querySelector('.fixed.inset-0');
            bg.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
        });
    </script>
</body></html>
