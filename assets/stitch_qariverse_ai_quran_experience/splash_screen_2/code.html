<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        @keyframes aura-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); filter: blur(40px); }
            50% { opacity: 0.8; transform: scale(1.1); filter: blur(60px); }
        }

        @keyframes particle-drift {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-aura { animation: aura-pulse 4s ease-in-out infinite; }
        
        .geometric-pattern {
            background-image: url("https://www.transparenttextures.com/patterns/islamic-art.png");
            opacity: 0.04;
            pointer-events: none;
        }

        .glass-depth {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 106, 57, 0.1);
        }

        .gold-text-gradient {
            background: linear-gradient(to bottom, #ffddb5 0%, #ffb957 50%, #805200 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>

</div>
</div>
<!-- Glowing Ring -->
<div class="absolute -inset-4 border-2 border-tertiary-fixed-dim/20 rounded-full animate-pulse blur-sm"></div>
</div>
<!-- Identity & Branding -->
<div class="mt-16 space-y-4 opacity-0 translate-y-8 animate-fade-in-up" style="animation: fadeInUp 1s ease-out forwards 0.5s;">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile gold-text-gradient tracking-tight drop-shadow-sm">
                QariVerse
            </h1>
<p class="font-body-en text-body-en text-outline max-w-xs mx-auto leading-relaxed">
                Experience the Divine Echoes in a Modern Sanctuary

<div class="pt-12 flex flex-col items-center gap-6">
<!-- Loading Indicator -->
<div class="flex gap-2">
<span class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: 0s"></span>
<span class="w-2 h-2 bg-primary/60 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
<span class="w-2 h-2 bg-primary/30 rounded-full animate-bounce" style="animation-delay: 0.4s"></span>
</div>
<!-- Secondary Spiritual Tag -->

                    Bismillah
                </span>
</div>
</div>
</main>
<!-- Interactions & Atmosphere Script -->
<script>
        // Particle Generator
        const container = document.getElementById('particle-container');
        const particleCount = 40;

        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 3 + 1;
            const startX = Math.random() * window.innerWidth;
            const startY = window.innerHeight + 10;
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 5;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${startX}px`;
            particle.style.top = `${startY}px`;
            particle.style.opacity = Math.random() * 0.5;
            particle.style.background = Math.random() > 0.5 ? '#ffddb5' : '#82faab';
            particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
            
            particle.style.animation = `particle-drift ${duration}s linear ${delay}s infinite`;
            
            container.appendChild(particle);
        }

        for (let i = 0; i < particleCount; i++) {
            createParticle();
        }

        // Custom Animation Definition (Tailwind doesn't have fadeInUp by default)
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // Interactive subtle mouse parallax for the main content
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('main').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body></html>
