<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QariVerse - Listen Anywhere</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Amiri:wght@400;700&family=Literata:wght@700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@100..900&family=Inter:wght@100..900&family=Literata:wght@100..900&display=swap" rel="stylesheet"/>
<!-- Shared Component Styling & Custom Animation Logic -->
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 106, 57, 0.05);
        }

        .neumorphic-push {
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.05), 
                        -6px -6px 12px rgba(255, 255, 255, 0.8);
        }

        .luminous-glow {
            box-shadow: 0 0 20px -2px rgba(0, 106, 57, 0.2);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Subtle Islamic Pattern Watermark */
        .islamic-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l2.121 5.121L37.242 3l1.637 5.293L44.142 6l.643 5.503L50.142 10l-.382 5.527L55.142 16l-1.382 5.366L58.142 22l-2.303 5.04L60 30l-4.161 2.96L58.142 38l-4.382.634L55.142 44l-5.382-1.261-.382 5.527L44.142 50l-4.743-2.707-.643 5.503L34.242 52l-2.121 5.121L30 60l-2.121-5.121L22.758 57l-1.637-5.293L15.858 54l-.643-5.503L9.858 50l.382-5.527L4.858 44l1.382-5.366L1.858 38l2.303-5.04L0 30l4.161-2.96L1.858 22l4.382-.634L4.858 16l5.382 1.261.382-5.527L15.858 10l4.743 2.707.643-5.503L25.758 8l2.121-5.121L30 0z' fill='%23006a39' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed": "#8df5e4",
                      "surface-dim": "#d8dadc",
                      "tertiary-container": "#a16800",
                      "on-tertiary-container": "#fffbff",
                      "surface-container-high": "#e6e8ea",
                      "on-tertiary-fixed": "#2a1800",
                      "secondary-fixed-dim": "#70d8c8",
                      "surface-container-low": "#f2f4f6",
                      "on-surface-variant": "#3e4a3f",
                      "secondary-container": "#8df5e4",
                      "background": "#f7f9fb",
                      "surface-bright": "#f7f9fb",
                      "surface-variant": "#e0e3e5",
                      "on-secondary": "#ffffff",
                      "on-secondary-fixed-variant": "#005048",
                      "surface-container": "#eceef0",
                      "surface-container-lowest": "#ffffff",
                      "tertiary": "#805200",
                      "tertiary-fixed": "#ffddb5",
                      "surface-container-highest": "#e0e3e5",
                      "inverse-primary": "#64dd91",
                      "secondary": "#006b5f",
                      "on-error-container": "#93000a",
                      "error-container": "#ffdad6",
                      "primary-fixed": "#82faab",
                      "primary-fixed-dim": "#64dd91",
                      "on-tertiary": "#ffffff",
                      "inverse-on-surface": "#eff1f3",
                      "on-primary": "#ffffff",
                      "on-primary-fixed": "#00210e",
                      "on-primary-container": "#f6fff4",
                      "error": "#ba1a1a",
                      "outline-variant": "#bdcabc",
                      "on-secondary-container": "#007165",
                      "on-background": "#191c1e",
                      "on-secondary-fixed": "#00201c",
                      "surface-tint": "#006d3a",
                      "on-surface": "#191c1e",
                      "inverse-surface": "#2d3133",
                      "primary-container": "#008649",
                      "primary": "#006a39",
                      "outline": "#6d7a6f",
                      "surface": "#f7f9fb",
                      "on-tertiary-fixed-variant": "#643f00",
                      "on-primary-fixed-variant": "#00522b",
                      "tertiary-fixed-dim": "#ffb957",
                      "on-error": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "unit": "4px",
                      "margin": "24px",
                      "card-padding": "20px"
              },
              "fontFamily": {
                      "label-caps": ["Inter"],
                      "body-en": ["Inter"],
                      "body-ar": ["Amiri"],
                      "display-ar": ["Amiri"],
                      "headline-lg-mobile": ["Literata"],
                      "headline-lg": ["Literata"]
              },
              "fontSize": {
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "body-en": ["16px", {"lineHeight": "26px", "fontWeight": "400"}],
                      "body-ar": ["24px", {"lineHeight": "48px", "fontWeight": "400"}],
                      "display-ar": ["48px", {"lineHeight": "72px", "fontWeight": "700"}],
                      "headline-lg-mobile": ["26px", {"lineHeight": "34px", "fontWeight": "700"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-en min-h-screen relative overflow-hidden">
<!-- Background Layer -->
<div class="fixed inset-0 islamic-pattern pointer-events-none opacity-40"></div>
<div class="fixed -top-40 -right-40 w-96 h-96 bg-primary/10 rounded-full blur-[100px]"></div>
<div class="fixed -bottom-40 -left-40 w-96 h-96 bg-secondary/10 rounded-full blur-[100px]"></div>
<!-- Onboarding Container -->
<div class="relative z-10 min-h-screen flex flex-col justify-between items-center px-margin py-12 md:max-w-md md:mx-auto">
<!-- Skip Button -->
<div class="w-full flex justify-end">
<button class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors py-2 px-4 rounded-full">
                Skip
            </button>
</div>
<!-- Main Visual Centerpiece -->
<div class="flex-1 flex flex-col items-center justify-center w-full space-y-12">
<!-- Glassmorphism Illustration Container -->
<div class="relative w-full max-w-[280px] aspect-square flex items-center justify-center">
<!-- Outer Glow and Rings -->
<div class="absolute inset-0 bg-secondary/5 rounded-full blur-3xl"></div>
<div class="absolute inset-0 border border-secondary/10 rounded-full animate-pulse"></div>
<!-- Main Phone Illustration (Glass Card) -->
<div class="relative z-20 w-48 h-80 glass-panel rounded-[40px] p-4 flex flex-col items-center justify-start border border-white/40 overflow-hidden shadow-2xl">
<!-- Internal App Interface Mockup -->
<div class="w-full h-4 bg-surface-container-highest/30 rounded-full mb-8"></div>
<div class="space-y-3 w-full">
<div class="w-3/4 h-3 bg-surface-container-highest/40 rounded-full"></div>
<div class="w-1/2 h-3 bg-surface-container-highest/20 rounded-full"></div>
</div>
<!-- Progress Circle -->
<div class="mt-12 relative flex items-center justify-center">
<svg class="w-24 h-24 transform -rotate-90">
<circle class="text-surface-variant/30" cx="48" cy="48" fill="transparent" r="40" stroke="currentColor" stroke-width="6"></circle>
<circle class="text-secondary" cx="48" cy="48" fill="transparent" r="40" stroke="currentColor" stroke-dasharray="251.2" stroke-dashoffset="100" stroke-width="6"></circle>
</svg>
<div class="absolute flex flex-col items-center">
<span class="material-symbols-outlined text-secondary text-3xl font-bold">check_circle</span>
</div>
</div>
<!-- Download List Mockup -->
<div class="mt-8 space-y-2 w-full">
<div class="flex items-center gap-2 p-2 bg-white/20 rounded-xl">
<div class="w-6 h-6 bg-secondary/20 rounded-md"></div>
<div class="flex-1 h-2 bg-secondary/30 rounded-full"></div>
</div>
<div class="flex items-center gap-2 p-2 bg-white/10 rounded-xl opacity-50">
<div class="w-6 h-6 bg-on-surface-variant/10 rounded-md"></div>
<div class="flex-1 h-2 bg-on-surface-variant/10 rounded-full"></div>
</div>
</div>
</div>
<!-- Floating Cloud Illustration -->
<div class="absolute -top-6 -right-4 z-30 animate-float">
<div class="glass-panel p-6 rounded-[32px] flex flex-col items-center justify-center shadow-xl border border-white/50">
<div class="bg-secondary-container w-16 h-16 rounded-2xl flex items-center justify-center shadow-inner neumorphic-push">
<span class="material-symbols-outlined text-secondary text-4xl" style="font-variation-settings: 'FILL' 1;">cloud_download</span>
</div>
</div>
</div>
<!-- Secondary Floating Particle (Audio Wave) -->
<div class="absolute bottom-10 -left-6 z-30 animate-float [animation-delay:2s]">
<div class="glass-panel p-4 rounded-2xl shadow-lg flex gap-1 items-end h-16">
<div class="w-1 bg-secondary rounded-full animate-bounce h-1/2"></div>
<div class="w-1 bg-primary rounded-full animate-bounce [animation-delay:0.2s] h-3/4"></div>
<div class="w-1 bg-secondary rounded-full animate-bounce [animation-delay:0.4s] h-full"></div>
<div class="w-1 bg-primary rounded-full animate-bounce [animation-delay:0.6s] h-2/3"></div>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-4 px-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">
                    Listen Anywhere
                </h1>
<p class="text-on-surface-variant font-body-en leading-relaxed max-w-xs mx-auto">
                    Download your favorite recitations and listen offline, even in the most remote sanctuaries.
                </p>
</div>
</div>
<!-- Footer Actions -->
<div class="w-full flex flex-col items-center space-y-8">
<!-- Pagination Dots -->
<div class="flex gap-3">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary luminous-glow"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Primary Navigation Action -->
<div class="w-full space-y-4">
<button class="w-full bg-primary text-on-primary font-body-en font-semibold py-4 rounded-2xl shadow-xl luminous-glow active:scale-95 transition-all flex items-center justify-center gap-2 group">
                    Next
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<button class="w-full border border-outline-variant text-on-surface-variant font-body-en font-medium py-4 rounded-2xl hover:bg-surface-container-low transition-colors">
                    Back
                </button>
</div>
</div>
</div>
<!-- Decorative Elements (Particles) -->
<div class="absolute top-1/4 left-10 w-2 h-2 bg-secondary rounded-full blur-[1px] opacity-40 animate-pulse"></div>
<div class="absolute bottom-1/3 right-12 w-3 h-3 bg-primary rounded-full blur-[1px] opacity-30 animate-pulse [animation-delay:1s]"></div>
<script>
        // Micro-interactions for button pressure effects
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Atmospheric parallax on mouse move (Desktop only)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 50;
                const moveY = (e.clientY - window.innerHeight / 2) / 50;
                
                document.querySelectorAll('.animate-float').forEach(el => {
                    el.style.transform = `translate(${moveX}px, ${moveY}px)`;
                });
            });
        }
    </script>
</body></html>
