name: qari_verse
description: "QariVerse - A premium Quranic experience app"
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  get: 
  get_it: 
  fpdart: 
  equatable: 
  collection:
  intl: 
  vector_math: 

  # Typography
  google_fonts: 

  # Design System
  flutter_svg: 
  lottie:
  flutter_animate: 
  shimmer: 

  # Quran Content
  quran:
    git:
      url: https://github.com/misterbrown3404/quran-1.4.1
      ref: main
  flutter_widget_from_html_core: 

  # Prayer Times & Hijri
  adhan: 
  hijri:
  geolocator: 
  geocoding: 

  # Audio Playback - Background Audio Support
  just_audio: 
  audio_session:
  audio_service: 
  just_audio_background:
  rxdart: 

  # State Management
  hydrated_bloc: 
  path_provider: 

  # Local Storage
  shared_preferences:
  hive:
  hive_flutter:
  flutter_secure_storage:

  # Networking
  dio: 
  http: 
  connectivity_plus: 
  flutter_cache_manager: 
  cached_network_image: 



  # Notifications
  flutter_local_notifications: 
  timezone: 
  flutter_timezone: 

  # Utilities
  url_launcher: 
  share_plus: 
  device_info_plus: 
  package_info_plus: 
  permission_handler:
  change_app_package_name: ^1.5.0

  # Monetization
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.1

# App launcher icon generated from the brand logo. Run:
#   dart run flutter_launcher_icons
# adaptive_icon_* produce the Android 8+ layered icon the launcher can mask
# into a circle/squircle. Without them Android shows the legacy PNG un-masked
# (square). The green matches the logo's gradient so the masked edges blend.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#175C46"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/azkar/
    - assets/illustrations/
    - assets/images/
    - assets/audio/
    - assets/audio/azkar_audio/opendua-audio-hisn-v0.0.2/
    - assets/google_fonts/
    - assets/stitch_qariverse_ai_quran_experience/animated_svg/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/google_fonts/Amiri-Regular.ttf
        - asset: assets/google_fonts/Amiri-Bold.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/google_fonts/Literata-Regular.ttf
        - asset: assets/google_fonts/Literata-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
        - asset: assets/google_fonts/Inter-Bold.ttf
        - asset: assets/google_fonts/Inter-Medium.ttf
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 700
         
